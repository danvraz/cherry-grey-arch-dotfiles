# ~/.config/hypr/hyprlock.conf
# enable pango so mask characters can be colored
renderer = pango

# ===== BACKGROUND (your wallpaper, blurred) =====
background {
    monitor = eDP-1
    path = /home/dan/Pictures/wallpapers/Ascii.png
    blur_passes = 2
    blur_size = 4
    vibrancy = 0.15
    contrast = 0.95
}

# ===== PASSWORD (invisible field but typed in red) =====
input-field {
    monitor = eDP-1

    input_field = true
    mask = true
    mask_char = "*"

    # 🔴 Red asterisk color
    color = rgba(255, 0, 0, 0.9)

    # fully invisible box
    outline_thickness = 0
    outer_color = rgba(0,0,0,0)
    inner_color = rgba(0,0,0,0)

    # position
    position = 0, -50
    halign = center
    valign = center

    # optional spacing between *
    # mask_char_spacing = 1
}

# ===== TIME =====
label {
    monitor = eDP-1
    text = cmd[update:1000] date '+%H:%M'
    font_family = JetBrainsMono Nerd Font
    font_size = 48
    color = rgba(200, 200, 200, 1)    # grey
    position = 0%,20%
    halign = center
}

# ===== DATE =====
label {
    monitor = eDP-1
    text = cmd[update:60000] date '+%a, %b %d'
    font_family = JetBrainsMono Nerd Font
    font_size = 20
    color = rgba(180, 180, 180, 1)    # lighter grey
    position = 0%,27%
    halign = center
}
