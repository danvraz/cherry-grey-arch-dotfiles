# ===============================
# FONT
# ===============================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10
adjust_line_height 2
adjust_column_width 0


shell_integration enabled


# ===============================
# CURSOR
# ===============================
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15

# ===============================
# WINDOW
# ===============================
background_opacity 0.65
window_padding_width 14
confirm_os_window_close 0

# ===============================
# SCROLLBACK
# ===============================
scrollback_lines 5000

# ===============================
# TABS (disabled look)
# ===============================
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal


# ===== MUTED ICY VAMPIRE PALETTE =====
foreground            #C7C7C7
background            #0B0B0E
background_opacity    0.90

# subtle cursor underline (blood frozen in glass)
cursor                #8A1543
cursor_shape          underline

selection_background  #1A1A20
selection_foreground  #C7C7C7

# black & grayscale — muted, dusty
color0   #0B0B0E
color8   #43444A

# icy vampire magenta-reds (accent)
color1   #8A1543
color9   #9F1B50

# muted cold green/cyan (rarely used, desaturated)
color2   #2C3A3A
color10  #3C4D4D

# dusty yellows (minimal contrast — fits muted aesthetic)
color3   #4A4340
color11  #615954

# cold steel blues
color4   #3E4451
color12  #515A69

# violet shadows — subtle, moody, not neon
color5   #5A3E55
color13  #704D68

# deep grey cyan — desaturated
color6   #3D4D52
color14  #4D6167

# white — muted, not pure #ffffff
color7   #C7C7C7
color15  #E3E3E3

# padding so terminal feels like a window, not a block
window_padding_width 5

# reduces eye-tearing text brightness
adjust_line_height 2
